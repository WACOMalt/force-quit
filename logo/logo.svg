<?xml version="1.0" encoding="UTF-8"?>
<!--
  Force Quit logo.

  Derived from the Breeze icon theme's "process-stop" action icon
  (breeze-icon-theme, LGPL-3.0-or-later AND CC-BY-SA-4.0), which is the icon
  the applet itself shows in the panel.

  Changes from the Breeze source: the canvas is square and 512x512, the glyph
  is scaled to fit it, and the Breeze colour #da4453 is written into the fill
  attribute. The original drives its colour through a CSS "currentColor"
  indirection that most SVG converters resolve to black.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <g fill="#da4453" fill-opacity="1" stroke="none">
    <g transform="scale(21.333333)">
      <g transform="translate(1,1)">
        <path d="M11 3c4.432 0 8 3.568 8 8 0 1.442-.383 2.79-1.045 3.955l-.738-.738A6.985 6.985 0 0 0 18 11c0-3.878-3.122-7-7-7a6.985 6.985 0 0 0-3.217.783l-.738-.738A7.982 7.982 0 0 1 11 3M4.045 7.045l.738.738A6.985 6.985 0 0 0 4 11c0 3.878 3.122 7 7 7a6.985 6.985 0 0 0 3.217-.783l.738.738A7.982 7.982 0 0 1 11 19c-4.432 0-8-3.568-8-8 0-1.442.383-2.79 1.045-3.955"/>
        <path d="M7.5 9.998h7v2h-7z"/>
      </g>
    </g>
  </g>
</svg>
